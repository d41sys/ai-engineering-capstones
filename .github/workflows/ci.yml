name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ragkit, minigpt, safegate, evalkit]
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff check packages/${{ matrix.package }}
      - run: uv run ruff format --check packages/${{ matrix.package }}
      - run: uv run mypy packages/${{ matrix.package }}/src
      - run: uv run pytest packages/${{ matrix.package }} -q
