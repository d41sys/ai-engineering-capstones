[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalkit"
version = "0.1.0"
description = "Evaluation runner and benchmark harness from first principles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
llm = [
    "anthropic>=0.20",
]

[project.scripts]
evalkit = "evalkit.cli:main"

